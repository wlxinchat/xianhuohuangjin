version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gold-trading-backend
    restart: unless-stopped
    ports:
      - "3012:3012"
    environment:
      - PORT=3012
      - NODE_ENV=production
      - UPDATE_INTERVAL=10000
    networks:
      - gold-trading-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3012/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gold-trading-frontend
    restart: unless-stopped
    ports:
      - "3011:3011"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_WS_URL=ws://localhost:3012
      - VITE_API_URL=http://localhost:3012/api
    networks:
      - gold-trading-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3011/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  gold-trading-network:
    driver: bridge

